<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Automated Vibe Check example output</title>
  <desc id="desc">Terminal-style mockup showing sample output from bash scripts/vibe-check.sh --hardening.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#171d33"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="120" r="180" fill="#4f46e5" opacity="0.10"/>
  <circle cx="180" cy="620" r="220" fill="#2563eb" opacity="0.08"/>

  <text x="88" y="94" fill="#e5e7eb" font-size="42" font-family="Menlo, Monaco, 'Courier New', monospace" font-weight="700">
    Vibe Coding Protocols
  </text>
  <text x="88" y="132" fill="#93c5fd" font-size="24" font-family="Menlo, Monaco, 'Courier New', monospace">
    Automated Vibe Check example output
  </text>

  <g filter="url(#shadow)">
    <rect x="80" y="170" width="1120" height="470" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <rect x="80" y="170" width="1120" height="52" rx="24" fill="#0b1220"/>
    <circle cx="116" cy="196" r="8" fill="#ef4444"/>
    <circle cx="142" cy="196" r="8" fill="#f59e0b"/>
    <circle cx="168" cy="196" r="8" fill="#10b981"/>
    <text x="220" y="203" fill="#94a3b8" font-size="18" font-family="Menlo, Monaco, 'Courier New', monospace">
      bash scripts/vibe-check.sh --hardening
    </text>

    <text x="120" y="272" fill="#cbd5e1" font-size="22" font-family="Menlo, Monaco, 'Courier New', monospace">
      <tspan fill="#93c5fd">$</tspan>
      <tspan dx="10">bash scripts/vibe-check.sh --hardening</tspan>
    </text>
    <text x="120" y="322" fill="#86efac" font-size="22" font-family="Menlo, Monaco, 'Courier New', monospace">PASS: README.md present</text>
    <text x="120" y="364" fill="#86efac" font-size="22" font-family="Menlo, Monaco, 'Courier New', monospace">PASS: .gitignore present</text>
    <text x="120" y="406" fill="#86efac" font-size="22" font-family="Menlo, Monaco, 'Courier New', monospace">PASS: AI instructions file present</text>
    <text x="120" y="448" fill="#fbbf24" font-size="22" font-family="Menlo, Monaco, 'Courier New', monospace">WARN: AUDIT_BACKLOG.md is missing for hardening mode</text>
    <text x="120" y="490" fill="#fbbf24" font-size="22" font-family="Menlo, Monaco, 'Courier New', monospace">WARN: public root AGENTS.md exists; sanitize public docs</text>
    <text x="120" y="550" fill="#f8fafc" font-size="24" font-family="Menlo, Monaco, 'Courier New', monospace" font-weight="700">Result: WARN</text>
    <text x="120" y="590" fill="#cbd5e1" font-size="22" font-family="Menlo, Monaco, 'Courier New', monospace">Summary: PASS=3 WARN=2 FAIL=0</text>
  </g>

  <text x="88" y="682" fill="#94a3b8" font-size="18" font-family="Menlo, Monaco, 'Courier New', monospace">
    Demo-style terminal mockup for the toolkit docs. Not a security verdict.
  </text>
</svg>
