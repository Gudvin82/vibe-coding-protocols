name: Bug report
description: Report a broken link, typo, unclear instruction or toolkit bug.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets, client data, private architecture docs or production configs.
  - type: input
    id: location
    attributes:
      label: File or page
      placeholder: README.md, protocols/ai-project-hardening-protocol.md, website URL, etc.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
