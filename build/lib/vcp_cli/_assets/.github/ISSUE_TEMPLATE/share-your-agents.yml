name: Share your AGENTS
description: Share a sanitized AGENTS.md excerpt and what it taught you.
title: "[AGENTS]: "
labels: [community, feedback]
body:
  - type: markdown
    attributes:
      value: Share only sanitized excerpts. Do not include secrets, private architecture docs or customer data.
  - type: input
    id: project_type
    attributes:
      label: Project type
      placeholder: SaaS MVP, Telegram bot, internal tool, landing page, API backend
    validations:
      required: true
  - type: input
    id: ai_ide
    attributes:
      label: AI IDE
      placeholder: Claude Code, Codex, Cursor, Windsurf, Copilot
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked?
    validations:
      required: true
  - type: textarea
    id: failed
    attributes:
      label: What failed or drifted?
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: Sanitized AGENTS excerpt
      description: Keep it short and remove any private identifiers.
  - type: checkboxes
    id: confirm
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private data
          required: true
