name: VCP PR Gate

on:
  pull_request:

jobs:
  vcp-pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install VCP from GitHub tag
        run: python -m pip install "git+https://github.com/Gudvin82/vibe-coding-protocols.git@v0.8.8"
      - name: Review diff
        run: vcp review-diff --json
      - name: Classify repository shape
        run: vcp classify --json

# Local equivalent: python3 -m vcp_cli review-diff --json && python3 -m vcp_cli release-check --json && python3 -m vcp_cli pr-gate explain --json
