<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VCP comparison map</title>
  <desc id="desc">Comparison diagram showing adjacent categories and VCP as the control layer.</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">VCP Comparison Map</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">adjacent tools do different jobs</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#111827">
    <rect x="110" y="240" width="300" height="220" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="260" y="310" font-size="34" font-weight="700">Spec Kit</text>
    <text x="260" y="372" font-size="28">what to build</text>

    <rect x="470" y="240" width="300" height="220" rx="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="620" y="310" font-size="34" font-weight="700">Full-stack templates</text>
    <text x="620" y="372" font-size="28">where to build</text>

    <rect x="830" y="240" width="300" height="220" rx="26" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="980" y="310" font-size="34" font-weight="700">AI agents</text>
    <text x="980" y="372" font-size="28">generate/edit code</text>

    <rect x="1190" y="200" width="300" height="300" rx="30" fill="#c7d2fe" stroke="#1d4ed8" stroke-width="5"/>
    <text x="1340" y="292" font-size="40" font-weight="700">VCP</text>
    <text x="1340" y="362" font-size="30">control what</text>
    <text x="1340" y="402" font-size="30">AI built</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M410 350 L460 350"/>
    <path d="M770 350 L820 350"/>
    <path d="M1130 350 L1180 350"/>
  </g>
</svg>
