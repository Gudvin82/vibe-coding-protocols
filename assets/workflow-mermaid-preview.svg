<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <rect x="40" y="40" width="1200" height="640" rx="28" fill="#0f172a"/>
  <text x="80" y="105" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Vibe Coding Protocols workflow</text>
  <text x="80" y="145" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="18">Starter to Hardening overview</text>
  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="250" width="150" height="72" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="165" y="294" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Idea</text>

    <rect x="290" y="250" width="190" height="72" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="385" y="294" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Product Brief</text>

    <rect x="540" y="250" width="210" height="72" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="645" y="294" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Starter Protocol</text>

    <rect x="800" y="250" width="180" height="72" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="890" y="294" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">AI Generation</text>

    <rect x="1020" y="250" width="170" height="72" rx="18" fill="#082f49" stroke="#22c55e" stroke-width="2"/>
    <text x="1105" y="294" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Vibe Check</text>
    <text x="1105" y="318" text-anchor="middle" fill="#bbf7d0" font-size="16">PASS</text>

    <rect x="845" y="470" width="210" height="78" rx="18" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/>
    <text x="950" y="515" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Hardening</text>
    <text x="950" y="540" text-anchor="middle" fill="#c4b5fd" font-size="18">audit and review</text>

    <line x1="240" y1="286" x2="290" y2="286" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowA)"/>
    <line x1="480" y1="286" x2="540" y2="286" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowA)"/>
    <line x1="750" y1="286" x2="800" y2="286" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowA)"/>
    <line x1="980" y1="286" x2="1020" y2="286" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowA)"/>
    <line x1="1105" y1="322" x2="1105" y2="430" stroke="#22c55e" stroke-width="4" marker-end="url(#arrowA)"/>
    <line x1="1105" y1="430" x2="1055" y2="430" stroke="#22c55e" stroke-width="4" marker-end="url(#arrowA)"/>
    <line x1="845" y1="510" x2="705" y2="510" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrowA)"/>
    <text x="720" y="495" fill="#ddd6fe" font-size="16">repeat until ready</text>

    <rect x="555" y="470" width="170" height="78" rx="18" fill="#3f1d2e" stroke="#f472b6" stroke-width="2"/>
    <text x="640" y="515" text-anchor="middle" fill="#fdf2f8" font-size="22" font-weight="700">Fix / Rollback</text>
    <text x="640" y="540" text-anchor="middle" fill="#f9a8d4" font-size="17">if stop condition hits</text>
