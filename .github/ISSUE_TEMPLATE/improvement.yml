name: Improvement
description: Suggest a protocol, wording or structure improvement.
title: "[Improve]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Keep suggestions vendor-neutral when possible and do not include private project details.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - README
        - Protocols
        - Prompts
        - Templates
        - Agents
        - Examples
        - Checklists
        - Docs
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
