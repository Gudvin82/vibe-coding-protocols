name: Documentation issue
description: Report unclear docs, stale routes or rendering problems.
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private project docs or customer data.
  - type: input
    id: page
    attributes:
      label: File or page
      placeholder: README.md, docs/faq.md, website URL
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or broken?
    validations:
      required: true
