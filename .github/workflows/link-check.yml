name: link-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate local markdown links
        run: python3 scripts/validate-links.sh
      - name: Lightweight placeholder scan
        run: bash scripts/scan-placeholders.sh
