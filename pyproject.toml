[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcp-cli"
version = "0.6.4"
description = "Local Python CLI and packaging surface for Vibe Coding Protocols"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [
  { name = "Anatoliy Malyshev" },
]

[project.scripts]
vcp = "vcp_cli.cli:main"
